
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spacesync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spacesync
  template:
    metadata:
      labels:
        app: spacesync
    spec:
      containers:
        - name: spacesync
          image: spacesync:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/SpaceSync?useSSL=false&allowPublicKeyRetrieval=true"
            - name: SPRING_DATASOURCE_USERNAME
              value: "spacesync"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "update"
---
apiVersion: v1
kind: Service
metadata:
  name: spacesync
spec:
  type: ClusterIP
  selector:
    app: spacesync
  ports:
    - port: 8081
      targetPort: 8081
