spring.application.name=SpaceSync

# 1. Database Connection Settings
# Telling Spring Boot to load the "application-dev.properties" file
spring.profiles.active=dev

# Make file named application-dev.properties and add:
#spring.datasource.url=jdbc:mysql://localhost:3306/SpaceSync?useSSL=false&serverTimezone=UTC
#spring.datasource.username=root
#spring.datasource.password=YOUR_PASSWORD

# 2. JPA / Hibernate Settings
# Set none as we already have schema from task 3
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 3. Server Settings
server.port=8081

# Prevents browser from caching logged-in pages after logout
spring.thymeleaf.cache=false
# Show the SQL queries Hibernate is running
# Show the actual transaction start, commit, and rollback actions
logging.level.org.springframework.transaction=DEBUG
logging.level.org.hibernate.transaction=DEBUG