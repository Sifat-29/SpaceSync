<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Groups | SpaceSync</title>
    <!-- Assuming Person C set up bootstrap in components -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2>SpaceSync: Team Coordination</h2>
    
    <!-- Create Group Card -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <form th:action="@{/groups/create}" method="post" class="d-flex gap-2">
                <input type="text" name="groupName" class="form-control" placeholder="New Team Name" required>
                <button type="submit" class="btn btn-primary">Create Team</button>
            </form>
        </div>
    </div>

    <!-- My Groups List -->
    <div class="row">
        <div class="col-md-12">
            <h4>Groups I Manage</h4>
            <div class="list-group">
                <div th:each="g : ${myGroups}" class="list-group-item d-flex justify-content-between align-items-center">
                    <span th:text="${g.groupName}" class="fw-bold"></span>
                    
                    <div>
                        <!-- Quick Invite simulation for the Demo -->
                        <form th:action="@{/groups/{gid}/invite/2(gid=${g.groupId})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-outline-secondary">Invite Priya (User 2)</button>
                        </form>
                        
                        <!-- Link to the Map Search -->
                        <a th:href="@{/search/{id}(id=${g.groupId})}" class="btn btn-sm btn-success">Find Fair Workspace</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
