<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Invites | SpaceSync</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2>My Pending Invitations</h2>
    <p class="text-muted">Accept invitations to join groups and start finding fair workspaces together.</p>

    <!-- Success Message -->
    <div th:if="${param.success}" class="alert alert-success">
        Invitation response recorded successfully!
    </div>

    <div class="row">
        <div class="col-md-8">
            <div th:if="${#lists.isEmpty(pendingInvites)}" class="alert alert-secondary">
                You have no pending invitations right now.
            </div>

            <!-- List of Invites -->
            <div class="list-group">
                <div th:each="invite : ${pendingInvites}" class="list-group-item d-flex justify-content-between align-items-center shadow-sm mb-2 rounded">
                    <div>
                        <h5 class="mb-1 text-primary" th:text="${invite.group.groupName}">Group Name</h5>
                        <small class="text-muted" th:text="'Invited by: ' + ${invite.sender.name}"></small><br>
                        <small class="text-muted" th:text="'Sent at: ' + ${#temporals.format(invite.sentAt, 'dd-MMM-yyyy HH:mm')}"></small>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <!-- Accept Form -->
                        <form th:action="@{/invites/{id}/respond(id=${invite.inviteId})}" method="post">
                            <input type="hidden" name="action" value="ACCEPT">
                            <button type="submit" class="btn btn-success btn-sm">Accept</button>
                        </form>
                        
                        <!-- Reject Form -->
                        <form th:action="@{/invites/{id}/respond(id=${invite.inviteId})}" method="post">
                            <input type="hidden" name="action" value="REJECT">
                            <button type="submit" class="btn btn-outline-danger btn-sm">Reject</button>
                        </form>
                    </div>
                </div>
            </div>
            
            <a th:href="@{/groups}" class="btn btn-primary mt-4">&larr; Back to My Groups</a>
        </div>
    </div>
</div>

</body>
</html>
