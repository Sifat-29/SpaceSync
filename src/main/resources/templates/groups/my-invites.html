<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments/components :: head-content}"></th:block></head>
<body class="bg-light">
<!-- Added missing Navbar -->
<div th:replace="~{fragments/components :: navbar}"></div>

<div class="container">
    <h2 class="fw-bold mb-4">My Pending Invitations</h2>

    <div th:if="${param.success}" class="alert alert-success">Response recorded!</div>

    <div class="row">
        <div class="col-md-8">
            <div th:if="${#lists.isEmpty(pendingInvites)}" class="alert alert-secondary text-center py-4">
                You have no pending invitations.
            </div>

            <div th:each="invite : ${pendingInvites}" class="card shadow-sm mb-3">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <h5 class="mb-1 text-primary" th:text="${invite.group.groupName}"></h5>
                        <small class="text-muted" th:text="'Invited by: ' + ${invite.sender.name}"></small>
                    </div>
                    <div class="d-flex gap-2">
                        <form th:action="@{/invites/{id}/respond(id=${invite.inviteId})}" method="post">
                            <input type="hidden" name="action" value="ACCEPT">
                            <button type="submit" class="btn btn-success btn-sm">Accept</button>
                        </form>
                        <form th:action="@{/invites/{id}/respond(id=${invite.inviteId})}" method="post">
                            <input type="hidden" name="action" value="REJECT">
                            <button type="submit" class="btn btn-outline-danger btn-sm">Reject</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/components :: scripts}"></div>
</body>
</html>
