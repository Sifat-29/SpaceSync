<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Smart Discovery | SpaceSync</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>#map { height: 400px; border-radius: 10px; }</style>
</head>
<body class="bg-light">

<div class="container mt-4">
    <h3>Algorithm Results: Fairest Locations</h3>
    <p class="text-muted">Ranked by standard deviation of commute times for your group.</p>

    <!-- The Map -->
    <div id="map" class="mb-4 shadow"></div>

    <!-- The Results -->
    <div class="row">
        <div th:each="space : ${spaces}" class="col-md-4 mb-3">
            <div class="card h-100 shadow-sm border-success">
                <div class="card-body">
                    <h5 th:text="${space.name}" class="card-title text-success"></h5>
                    <p class="card-text mb-1" th:text="${space.street + ', ' + space.city}"></p>
                    
                    <!-- Dummy Form to execute the Booking -->
                    <form th:action="@{/search/book}" method="post" class="mt-3">
                        <input type="hidden" name="groupId" th:value="${groupId}">
                        <input type="hidden" name="spaceId" th:value="${space.spaceId}">
                        <input type="hidden" name="roomId" value="1"> <!-- Simulating Booking Room 1 -->
                        <input type="hidden" name="amount" value="800.00">
                        <button type="submit" class="btn btn-success w-100">Secure Booking & Pay</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script th:inline="javascript">
    // Initialize Map centered on Delhi
    var map = L.map('map').setView([28.6139, 77.2090], 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    // Loop through the fair spaces and add green pins
    var spaces = /*[[${spaces}]]*/[];
    spaces.forEach(function(s) {
        var marker = L.marker([s.latitude, s.longitude]).addTo(map);
        marker.bindPopup("<b>" + s.name + "</b><br>Suggested Fair Match");
    });
</script>

</body>
</html>
