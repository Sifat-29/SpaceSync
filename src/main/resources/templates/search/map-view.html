<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/components :: head-content}"></th:block>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 450px; border-radius: 12px; margin-bottom: 30px; border: 1px solid #ddd; }
        .dist-badge { font-size: 0.7rem; padding: 5px 8px; }
        .fav-card { border: 2px solid #ffc107 !important; box-shadow: 0 0 15px rgba(255, 193, 7, 0.3) !important; }
        .amenity-badge { font-weight: normal; font-size: 0.75rem; background-color: #e9ecef; color: #495057; }
    </style>
</head>
<body class="bg-light">
<div th:replace="~{fragments/components :: navbar}"></div>

<div class="container mb-5">

    <!-- TASK 6: UI ALERTS FOR TRANSACTIONS -->
    <div th:if="${successMsg}" class="alert alert-success shadow-sm border-success fw-bold">
        ✅ <span th:text="${successMsg}"></span>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger shadow-sm border-danger fw-bold">
        ❌ <span th:text="${errorMsg}"></span>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4 mt-3">
        <h2 class="fw-bold">Available Fairest Workspaces</h2>
        <div class="text-end">
            <span class="badge bg-dark" th:text="${type == 'ROOM' ? 'Private Rooms' : 'Shared Desks'}"></span>
            <p class="small text-muted mb-0" th:text="${#temporals.format(startDT, 'dd MMM, HH:mm')} + ' - ' + ${#temporals.format(endDT, 'HH:mm')}"></p>
        </div>
    </div>

    <div id="map" class="shadow-sm"></div>

    <div class="row g-4">
        <div th:each="res : ${results}" class="col-md-6 col-lg-4">

            <div class="card h-100 shadow border-0 overflow-hidden" th:classappend="${favSpaceId == res.space.spaceId ? 'fav-card' : ''}">

                <div th:if="${favSpaceId == res.space.spaceId}" class="bg-warning text-dark text-center fw-bold small py-1">
                    ⭐ Group Favorite
                </div>

                <div class="card-header bg-white border-0 pt-3 d-flex justify-content-between">
                    <div>
                        <h5 class="fw-bold mb-0 text-success" th:text="${res.space.name}"></h5>
                        <small class="text-muted" th:text="${(res.space.street != null ? res.space.street + ', ' : '') + res.space.city}"></small>
                    </div>
                    <div class="text-end">
                        <div class="text-warning fw-bold">⭐ <span th:text="${#numbers.formatDecimal(res.avgRating,1,1)}">0.0</span></div>
                        <button class="btn btn-link btn-sm p-0 text-info" data-bs-toggle="modal" th:data-bs-target="'#revModal'+${res.space.spaceId}" th:text="${res.reviewCount} + ' reviews'"></button>
                    </div>
                </div>

                <div class="card-body">
                    <div class="mb-3">
                        <label class="small fw-bold text-uppercase text-muted mb-1">Amenities:</label>
                        <div>
                            <span th:each="am : ${res.space.amenities}" class="badge amenity-badge border me-1 mb-1" th:text="${am.amenityName}"></span>
                            <span th:if="${#lists.isEmpty(res.space.amenities)}" class="text-muted small">Standard setup</span>
                        </div>
                    </div>

                    <label class="small fw-bold text-uppercase text-muted mb-2">Member Commutes:</label>
                    <div class="mb-3">
                        <span th:each="md : ${res.memberDistances}" class="badge bg-light text-dark border dist-badge mb-1 me-1">
                            <span th:text="${md.name}"></span>: <b th:text="${#numbers.formatDecimal(md.dist,1,1)}"></b>km
                        </span>
                    </div>

                    <form th:action="@{/search/book}" method="post">
                        <input type="hidden" name="groupId" th:value="${groupId}">
                        <input type="hidden" name="spaceId" th:value="${res.space.spaceId}">
                        <input type="hidden" name="type" th:value="${type}">
                        <input type="hidden" name="start" th:value="${#temporals.format(startDT, 'yyyy-MM-dd''T''HH:mm:ss')}">
                        <input type="hidden" name="end" th:value="${#temporals.format(endDT, 'yyyy-MM-dd''T''HH:mm:ss')}">

                        <div class="mb-3 p-2 bg-light border rounded text-center">
                            <span class="small fw-bold text-muted text-uppercase">Total Price</span><br>
                            <span class="fs-5 fw-bold text-success" th:text="'₹' + ${res.inventory[0].totalPrice}"></span>
                        </div>

                        <input type="hidden" name="invId" th:value="${res.inventory[0].id}">
                        <input type="hidden" name="amount" th:value="${res.inventory[0].totalPrice}">

                        <!-- TASK 6 DEMO TOOLS -->
                        <div class="bg-light border rounded p-2 mb-3">
                            <label class="small fw-bold text-danger mb-1"> Task 6 Demo Tools:</label>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="simulateError" value="true" id="errCheck">
                                <label class="form-check-label small text-muted" for="errCheck">Force Payment Failure (Rollback)</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="simulateDelay" value="true" id="delayCheck">
                                <label class="form-check-label small text-muted" for="delayCheck">Hold DB Lock for 5 Seconds</label>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success w-100 fw-bold shadow-sm">Secure Booking</button>
                    </form>

                    <div th:if="${favSpaceId == res.space.spaceId}" class="mt-2 text-center">
                        <button type="button" class="btn btn-warning w-100 btn-sm fw-bold disabled" style="opacity: 1;">⭐ Team Favorite</button>
                    </div>

                    <form th:unless="${favSpaceId == res.space.spaceId}" th:action="@{/groups/{gid}/favorite/{sid}(gid=${groupId}, sid=${res.space.spaceId})}" method="post" class="mt-2">
                        <button type="submit" class="btn btn-outline-warning w-100 btn-sm">⭐ Set as Group Favorite</button>
                    </form>
                </div>

                <div class="card-footer bg-light border-0 py-2 text-center">
                    <small class="text-muted">Fairness Score: <b class="text-primary" th:text="${#numbers.formatDecimal(res.fairnessScore,1,1)} + '/100'"></b></small>
                </div>
            </div>

            <!-- Review Modal -->
            <div class="modal fade" th:id="'revModal'+${res.space.spaceId}" tabindex="-1">
                <div class="modal-dialog"><div class="modal-content">
                    <div class="modal-header"><h5>Reviews for <span th:text="${res.space.name}"></span></h5></div>
                    <div class="modal-body">
                        <div th:each="rv : ${res.reviews}" class="border-bottom mb-2 pb-2">
                            <div class="d-flex justify-content-between">
                                <strong th:text="${rv.user.name}"></strong>
                                <span class="text-warning" th:text="'⭐'+${rv.rating}"></span>
                            </div>
                            <p class="small mb-0 text-muted" th:text="${rv.comment}"></p>
                        </div>
                        <p th:if="${#lists.isEmpty(res.reviews)}" class="text-center text-muted">No reviews yet.</p>
                    </div>
                </div></div>
            </div>

        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script th:inline="javascript">
    var map = L.map('map').setView([28.61, 77.20], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    var results = /*[[${results}]]*/ [];
    var members = /*[[${members}]]*/[];

    var userIcon = L.icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png', iconSize:[25, 41] });
    var spaceIcon = L.icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png', iconSize:[25, 41] });

    members.forEach(m => L.marker([m.latitude, m.longitude], {icon: userIcon}).addTo(map).bindPopup("User: "+m.name));
    results.forEach(r => L.marker([r.space.latitude, r.space.longitude], {icon: spaceIcon}).addTo(map).bindPopup("Space: "+r.space.name));
</script>
<div th:replace="~{fragments/components :: scripts}"></div>
</body>
</html>
