<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head-content">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SpaceSync</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: bold; letter-spacing: 1px; }
    </style>
</head>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">🚀 SpaceSync</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <th:block th:if="${session.role == 'USER'}">
                    <li class="nav-item"><a class="nav-link" href="/groups">My Groups</a></li>

                    <li class="nav-item">
                        <a class="nav-link" href="/invites/my">
                            My Invites
                            <span th:if="${pendingInvitesCount != null && pendingInvitesCount > 0}"
                                  class="badge bg-danger rounded-pill ms-1"
                                  th:text="${pendingInvitesCount}"></span>
                        </a>
                    </li>

                    <li class="nav-item"><a class="nav-link" href="/bookings/active">Active Bookings</a></li>
                    <li class="nav-item"><a class="nav-link" href="/bookings/history">History</a></li>
                </th:block>
                <li class="nav-item" th:if="${session.role == 'VENDOR'}">
                    <a class="nav-link" href="/vendor/dashboard">Dashboard</a>
                </li>
                <li class="nav-item" th:if="${session.role == 'ADMIN'}">
                    <a class="nav-link" href="/admin/dashboard">Admin Panel</a>
                </li>
            </ul>

            <ul class="navbar-nav" th:if="${session.userName != null}">
                <li class="nav-item">
                    <a class="nav-link text-info fw-bold" href="/user/profile">📍 <span th:text="${session.userName}"></span></a>
                </li>
                <li class="nav-item"><a class="btn btn-sm btn-outline-danger ms-3 mt-1" href="/logout">Logout</a></li>
            </ul>
        </div>
    </div>
</nav>

<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</div>
</html>
