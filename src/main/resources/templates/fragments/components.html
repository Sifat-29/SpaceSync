<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- 1. HEAD FRAGMENT (Shared CSS) -->
<head th:fragment="head-content">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SpaceSync</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: bold; letter-spacing: 1px; }
    </style>
</head>

<!-- 2. NAVBAR FRAGMENT -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <!-- Logo -->
        <a class="navbar-brand" href="/"> SpaceSync</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <!-- App Links (For Person A and B) -->
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <!-- Person A will build this page -->
                    <a class="nav-link" href="/search">Find Workspace</a>
                </li>
                <li class="nav-item">
                    <!-- Person B will build this page -->
                    <a class="nav-link" href="/vendor/dashboard">Vendor Dashboard</a>
                </li>
                <li class="nav-item">
                    <!-- Person B will build this page -->
                    <a class="nav-link" href="/admin/audit">Audit Logs</a>
                </li>
            </ul>

            <!-- The "Fake Login" Switcher -->
            <ul class="navbar-nav">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle btn btn-outline-secondary text-white border-0" href="#" role="button" data-bs-toggle="dropdown">
                        👤 Simulating User: <strong>Rahul (Group Admin)</strong>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><h6 class="dropdown-header">Select Persona</h6></li>
                        <li><a class="dropdown-item" href="#">Rahul (Group Admin)</a></li>
                        <li><a class="dropdown-item" href="#">Innovate Corp (Vendor)</a></li>
                        <li><a class="dropdown-item" href="#">Sifat (System Admin)</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- 3. SCRIPTS FRAGMENT (Shared JS) -->
<div th:fragment="scripts">
    <!-- Bootstrap 5 JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</div>

</html>
