<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"></head>
<body class="bg-light container py-5">
<h2>Vendor Dashboard</h2>
<div class="card bg-success text-white my-4 p-3 shadow" style="width: 18rem;">
    <h5>Total Revenue</h5>
    <h2 th:text="'₹' + ${totalRevenue}"></h2>
</div>
<h4>My Properties</h4>
<table class="table table-hover bg-white shadow-sm">
    <thead><tr><th>Name</th><th>City</th><th>Status</th></tr></thead>
    <tbody>
    <tr th:each="s : ${mySpaces}">
        <td th:text="${s.name}"></td><td th:text="${s.city}"></td>
        <td><span th:text="${s.approvalStatus}" class="badge" th:classappend="${s.approvalStatus=='Approved'?'bg-success':'bg-warning'}"></span></td>
    </tr>
    </tbody>
</table>
<a href="/vendor/add-space" class="btn btn-primary mt-3">+ List New Space</a>
</body>
</html>
