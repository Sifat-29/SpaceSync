<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>List New Workspace</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">List Your Workspace</h4>
                </div>
                <div class="card-body">
                    <!-- This 'th:object' MUST match the name used in your Java Controller -->
                    <form th:action="@{/vendor/add-space}" th:object="${coworkingSpace}" method="post">

                        <div class="mb-3">
                            <label class="form-label">Property Name</label>
                            <input type="text" th:field="*{name}" class="form-control" required placeholder="e.g. Innovation Hub">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">City</label>
                                <input type="text" th:field="*{city}" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Zip Code</label>
                                <input type="text" th:field="*{zip}" class="form-control" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Street Address</label>
                            <input type="text" th:field="*{street}" class="form-control" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Latitude</label>
                                <input type="number" step="any" th:field="*{latitude}" class="form-control" required placeholder="28.6139">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Longitude</label>
                                <input type="number" step="any" th:field="*{longitude}" class="form-control" required placeholder="77.2090">
                            </div>
                        </div>

                        <div class="mt-4">
                            <button type="submit" class="btn btn-success w-100">Submit for Approval</button>
                            <a href="/vendor/dashboard" class="btn btn-link w-100 mt-2 text-decoration-none">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
