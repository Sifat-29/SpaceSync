<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/components :: head-content}"></th:block>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>#pickerMap { height: 350px; width: 100%; border-radius: 8px; cursor: crosshair; }</style>
</head>
<body class="bg-light">
<div th:replace="~{fragments/components :: navbar}"></div>

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white p-3">
                    <h4 class="mb-0">✏️ Edit Space: <span th:text="${space.name}"></span></h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/vendor/space/update}" method="post" class="needs-validation" novalidate>
                        <input type="hidden" name="spaceId" th:value="${space.spaceId}">

                        <div class="row g-3 mb-4">
                            <div class="col-md-12">
                                <label class="form-label fw-bold">Space Name</label>
                                <input type="text" name="name" th:value="${space.name}" maxlength="100" class="form-control" required>
                                <div class="invalid-feedback">Please provide a space name.</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Street</label>
                                <input type="text" name="street" th:value="${space.street}" maxlength="255" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">City</label>
                                <input type="text" name="city" th:value="${space.city}" maxlength="100" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Opening Time</label>
                                <input type="time" name="openingTime" th:value="${space.openingTime}" pattern="[0-2][0-9]:[0-5][0-9]" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Closing Time</label>
                                <input type="time" name="closingTime" th:value="${space.closingTime}" pattern="[0-2][0-9]:[0-5][0-9]" class="form-control" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-4 bg-white p-3 rounded border">
                            <div class="col-12"><h6 class="text-primary fw-bold">Update Inventory Rates</h6></div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Meeting Room Rate (₹)</label>
                                <input type="number" name="roomRate" th:value="${room != null ? room.hourlyRate : ''}" class="form-control" min="0" max="100000" required>
                                <div class="invalid-feedback">Rate cannot be negative and max limit is ₹100,000.</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Meeting Room Capacity</label>
                                <input type="number" name="roomCapacity" th:value="${room != null ? room.capacity : ''}" class="form-control" min="1" max="1000" required>
                                <div class="invalid-feedback">Capacity must be between 1 and 1000.</div>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label small fw-bold">Open Desk Rate (₹)</label>
                                <input type="number" name="deskRate" th:value="${desk != null ? desk.dailyRate : ''}" class="form-control" min="0" max="100000" required>
                                <div class="invalid-feedback">Rate cannot be negative and max limit is ₹100,000.</div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Amenities</label>
                            <div class="row row-cols-2 row-cols-md-4 g-2">
                                <div class="col" th:each="amenity : ${allAmenities}">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="amenityIds"
                                               th:value="${amenity.amenityId}"
                                               th:checked="${#lists.contains(space.amenities, amenity)}">
                                        <label class="form-check-label" th:text="${amenity.amenityName}"></label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Update Location on Map</label>
                            <div id="pickerMap" class="mb-2"></div>
                            <input type="hidden" id="lat" name="latitude" th:value="${space.latitude}">
                            <input type="hidden" id="lng" name="longitude" th:value="${space.longitude}">
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">Update Listing</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script th:inline="javascript">
    var initialLat = [[${space.latitude}]];
    var initialLng = [[${space.longitude}]];

    var map = L.map('pickerMap').setView([initialLat, initialLng], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    var marker = L.marker([initialLat, initialLng]).addTo(map);

    map.on('click', function(e) {
        marker.setLatLng(e.latlng);
        document.getElementById('lat').value = e.latlng.lat;
        document.getElementById('lng').value = e.latlng.lng;
    });

    // FIX: Bootstrap form validation script
    (() => {
        'use strict'
        const forms = document.querySelectorAll('.needs-validation')
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }
                form.classList.add('was-validated')
            }, false)
        })
    })()
</script>
<div th:replace="~{fragments/components :: scripts}"></div>
</body>
</html>
