
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments/components :: head-content}"></th:block></head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 rounded-lg">
                <div class="card-body p-5 text-center">
                    <h2 class="fw-bold mb-4"> SpaceSync</h2>

                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                    <div th:if="${param.registered}" class="alert alert-success">Registration successful! Please login.</div>

                    <form th:action="@{/login}" method="post">
                        <div class="form-floating mb-3">
                            <input type="text" name="identifier" class="form-control" id="identifier" placeholder="Username or Phone" required>
                            <label for="identifier">Username or Phone Number</label>
                        </div>

                        <div class="form-floating mb-4 position-relative">
                            <input type="password" name="password" class="form-control" id="password" placeholder="Password" required>
                            <label for="password">Password</label>
                            <button type="button" class="btn position-absolute top-50 end-0 translate-middle-y me-2 bg-transparent border-0" id="togglePassword" style="z-index: 5;">
                                Show
                            </button>
                        </div>

                        <button class="btn btn-primary w-100 btn-lg mb-3" type="submit">Login</button>
                    </form>

                    <hr>
                    <p class="text-muted mb-2">New to SpaceSync?</p>
                    <div class="d-flex justify-content-between">
                        <a href="/register/user" class="btn btn-outline-secondary w-100 me-1">Sign Up as User</a>
                        <a href="/register/vendor" class="btn btn-outline-dark w-100 ms-1">Sign Up as Vendor</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('togglePassword').addEventListener('click', function () {
        const passwordInput = document.getElementById('password');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            this.textContent = 'Hide';
        } else {
            passwordInput.type = 'password';
            this.textContent = 'Show';
        }
    });
</script>
</body>
</html>
