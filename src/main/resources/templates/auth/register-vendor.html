<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments/components :: head-content}"></th:block></head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm p-4">
                <h3 class="mb-4">Register as Vendor</h3>
                <form th:action="@{/register/vendor}" method="post">
                    <input type="text" name="businessName" class="form-control mb-3" placeholder="Business Name" required>
                    <input type="text" name="businessLicense" class="form-control mb-3" placeholder="Business License No." required>
                    <input type="email" name="contactEmail" class="form-control mb-3" placeholder="Contact Email" required>
                    <input type="text" name="username" class="form-control mb-3" placeholder="Login Username" required>
                    <input type="password" name="password" class="form-control mb-4" placeholder="Password" required>

                    <button type="submit" class="btn btn-dark w-100">Apply for Vendor Account</button>
                </form>
                <a href="/login" class="d-block text-center mt-3">Cancel</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
