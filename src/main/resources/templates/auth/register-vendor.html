<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments/components :: head-content}"></th:block></head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm p-4">
                <h3 class="mb-4">Register as Vendor</h3>

                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <form th:action="@{/register/vendor}" method="post">
                    <label class="form-label mb-1 small text-muted">Business Name</label>
                    <input type="text" name="businessName" class="form-control mb-3" maxlength="100" placeholder="Business Name" required>

                    <label class="form-label mb-1 small text-muted">Business License No.</label>
                    <input type="text" name="businessLicense" class="form-control mb-3" maxlength="50" placeholder="License Number" required>

                    <label class="form-label mb-1 small text-muted">Contact Email</label>
                    <input type="email" name="contactEmail" class="form-control mb-3" maxlength="100" placeholder="Contact Email" required>

                    <label class="form-label mb-1 small text-muted">Login Username</label>
                    <input type="text" name="username" class="form-control mb-3" maxlength="50" placeholder="Login Username" required>

                    <label class="form-label mb-1 small text-muted">Password</label>
                    <div class="position-relative mb-4">
                        <input type="password" name="password" id="venPassword" class="form-control" placeholder="Password" required>
                        <button type="button" class="btn position-absolute top-50 end-0 translate-middle-y bg-transparent border-0" id="toggleVenPassword">👁️</button>
                    </div>

                    <button type="submit" class="btn btn-dark w-100">Apply for Vendor Account</button>
                </form>
                <a href="/login" class="d-block text-center mt-3">Cancel</a>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('toggleVenPassword').addEventListener('click', function () {
        const passwordInput = document.getElementById('venPassword');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            this.textContent = '🙈';
        } else {
            passwordInput.type = 'password';
            this.textContent = '👁️';
        }
    });
</script>
</body>
</html>
