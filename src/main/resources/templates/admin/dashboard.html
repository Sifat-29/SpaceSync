<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments/components :: head-content}"></th:block></head>
<body class="bg-light">
<div th:replace="~{fragments/components :: navbar}"></div>
<div class="container mt-5">
    <h1 class="mb-4"> System Administration</h1>
    <div class="row g-4">
        <div class="col-md-4">
            <div class="card shadow p-4 text-center border-warning">
                <!-- The ?: 0 ensures that if the variable is null, it shows 0 instead of crashing -->
                <h2 th:text="${(pendingVendorsCount ?: 0) + (pendingSpacesCount ?: 0)}">0</h2>
                <p class="text-muted">Pending Verifications</p>
                <a href="/admin/verify" class="btn btn-warning w-100">Review Requests</a>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow p-4 text-center border-info">
                <h2>Log</h2>
                <p class="text-muted">System Audit History</p>
                <a href="/admin/audit" class="btn btn-info w-100 text-white">View Logs</a>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow p-4 text-center border-primary">
                <h2>Catalog</h2>
                <p class="text-muted">Global Amenities</p>
                <a href="/admin/amenities" class="btn btn-primary w-100">Manage Features</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
