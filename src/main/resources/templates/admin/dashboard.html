<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"></head>
<body class="bg-light container py-5">
<h2>Admin Dashboard</h2>
<div class="row mt-4">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-primary text-white">Pending Vendors</div>
            <!-- Update Pending Vendors Section -->
            <ul class="list-group list-group-flush">
                <li th:each="v : ${pendingVendors}" class="list-group-item d-flex justify-content-between">
                    <span th:text="${v.businessName}"></span>
                    <form th:action="@{'/admin/approve-vendor/'+${v.vendorId}}" method="post">
                        <button class="btn btn-sm btn-success">Verify</button>
                    </form>
                </li>
                <!-- This line shows up only if the list is empty -->
                <li th:if="${#lists.isEmpty(pendingVendors)}" class="list-group-item text-muted text-center">
                    No vendors awaiting verification.
                </li>
            </ul>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-info text-white">Pending Spaces</div>
            <ul class="list-group list-group-flush">
                <li th:each="s : ${pendingSpaces}" class="list-group-item d-flex justify-content-between">
                    <span th:text="${s.name}"></span>
                    <form th:action="@{'/admin/approve-space/'+${s.spaceId}}" method="post">
                        <button class="btn btn-sm btn-success">Approve</button>
                    </form>
                </li>
                <li th:if="${#lists.isEmpty(pendingSpaces)}" class="list-group-item text-muted text-center">
                    No spaces awaiting approval.
                </li>
            </ul>
        </div>
    </div>
</div>
<h3 class="mt-5">System Audit Log</h3>
<table class="table table-dark table-striped mt-3">
    <thead><tr><th>Booking</th><th>Old Status</th><th>New Status</th><th>Time</th></tr></thead>
    <tbody>
    <tr th:each="log : ${auditLogs}">
        <td th:text="${log.bookingId}"></td>
        <td th:text="${log.oldStatus}"></td>
        <td th:text="${log.newStatus}"></td>
        <td th:text="${log.timestamp}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
