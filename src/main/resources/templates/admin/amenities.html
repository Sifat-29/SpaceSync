<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments/components :: head-content}"></th:block></head>
<body class="bg-light">
<div th:replace="~{fragments/components :: navbar}"></div>
<div class="container mt-5">
    <h2 class="mb-4">🛠️ Manage Global Amenities</h2>
    <div class="row">
        <div class="col-md-4">
            <div class="card shadow p-4 mb-4">
                <h5>Add New Amenity</h5>
                <form th:action="@{/admin/amenities/add}" method="post">
                    <input type="text" name="name" class="form-control mb-3" placeholder="e.g., 5G Internet" required>
                    <button class="btn btn-primary w-100">Add to Catalog</button>
                </form>
            </div>
        </div>
        <div class="col-md-8">
            <div class="card shadow">
                <ul class="list-group list-group-flush">
                    <li th:each="a : ${amenities}" class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <span th:text="${a.amenityName}" class="fw-bold"></span><br>
                            <small class="text-muted" th:text="'By: ' + ${a.createdByAdmin.username}"></small>
                        </div>
                        <form th:action="@{/admin/amenity/delete/{id}(id=${a.amenityId})}" method="post">
                            <button class="btn btn-sm btn-outline-danger" onclick="return confirm('Remove this amenity globally?')">Delete</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
</body>
</html>
